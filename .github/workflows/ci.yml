name: ci

on:
  pull_request:

permissions:
  contents: read

env:
  POETRY_VERSION: "2.5.1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_INSTALLER_RE_RESOLVE: "false"

jobs:
  lint-test-and-docker-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install "poetry==$POETRY_VERSION"
          poetry --version

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ env.POETRY_VERSION }}-${{ runner.os }}-${{ runner.arch }}-python-${{ steps.python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Install deps
        run: |
          poetry check --lock
          poetry sync --only main,dev --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Tests
        run: |
          poetry run pytest -q \
            --cov=docker_healthcheck_exporter \
            --cov-report=term-missing \
            --cov-fail-under=95

      - name: Python compile sanity check
        run: |
          poetry run python -m compileall -q docker_healthcheck_exporter

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker build (PR validation, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: docker-healthcheck-exporter:pr
          cache-from: type=gha,scope=docker-ci
          cache-to: type=gha,scope=docker-ci,mode=max
          provenance: false
          sbom: false

      - name: Check runtime dependencies
        run: |
          docker run --rm --entrypoint python docker-healthcheck-exporter:pr -c '
          import importlib.util
          from docker_healthcheck_exporter import __version__
          import fastapi, uvicorn, aiodocker
          assert all(importlib.util.find_spec(name) is None for name in ("pytest", "ruff", "PyInstaller", "poetry"))
          print("Runtime dependencies OK, project version:", __version__)
          '
