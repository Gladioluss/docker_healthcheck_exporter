name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  POETRY_VERSION: "2.5.1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_INSTALLER_RE_RESOLVE: "false"

jobs:
  build-deb-and-docker:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set build date
        id: builddate
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install "poetry==$POETRY_VERSION"
          poetry --version

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ env.POETRY_VERSION }}-${{ runner.os }}-${{ runner.arch }}-python-${{ steps.python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}

      - name: Read and validate project version
        id: ver
        run: |
          VERSION="$(poetry version --short)"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install deps
        run: |
          poetry check --lock
          poetry sync --only main,build --no-interaction

      - name: Build binary (PyInstaller)
        run: |
          poetry run pyinstaller -F -n docker-healthcheck-exporter main.py --clean --copy-metadata docker-healthcheck-exporter
          test -f dist/docker-healthcheck-exporter
          ls -la dist/

      - name: Install nfpm
        run: |
          set -euo pipefail
          echo "deb [trusted=yes] https://repo.goreleaser.com/apt/ /" | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm
          nfpm --version

      - name: Prepare scripts permissions
        run: |
          chmod +x packaging/deb/postinstall.sh packaging/deb/preremove.sh

      - name: Build deb
        run: |
          nfpm package -p deb -f packaging/nfpm.yaml
          ls -la *.deb

      - name: Checksums
        run: |
          sha256sum *.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build & push Docker image (tag + latest)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.builddate.outputs.date }}
          cache-from: type=gha,scope=docker-release
          cache-to: type=gha,scope=docker-release,mode=max
          provenance: false
          sbom: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.deb
            SHA256SUMS.txt
