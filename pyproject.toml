[project]
name = "docker-healthcheck-exporter"
version = "1.0.2"
description = "Prometheus exporter for Docker container healthchecks"
authors = [
    {name = "Gladioluss",email = "emurashin@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "aiodocker==0.27.0"
]

[tool.poetry]
requires-poetry = "==2.5.1"
packages = [{ include = "docker_healthcheck_exporter" }]

[tool.poetry.group.dev.dependencies]
ruff = "^0.17.2"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"

[tool.poetry.group.build]
optional = true

[tool.poetry.group.build.dependencies]
pyinstaller = {version = "6.22.3", python = "<3.15"}

[project.scripts]
docker-healthcheck-exporter = "docker_healthcheck_exporter.__main__:main"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["docker_healthcheck_exporter"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"
